name: Build Linux AppImage & Portable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v prefix (e.g. 1.0.1)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-linux-appimage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: budget

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          RAW="${{ github.event.inputs.version || github.ref_name }}"
          echo "version=${RAW#v}" >> "$GITHUB_OUTPUT"

      - name: Install Linux build and AppImage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsqlite3-dev \
            curl desktop-file-utils

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - name: Build Linux release bundle
        run: flutter build linux --release --build-name="${{ steps.ver.outputs.version }}" --build-number="${{ github.run_number }}"

      - name: Package AppImage and portable tarball
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p dist
          tar -czf "dist/cashon-${VERSION}-linux-x64.tar.gz" -C build/linux/x64/release/bundle .
          ./scripts/build_appimage.sh --skip-flutter

      - uses: actions/upload-artifact@v4
        with:
          name: cashon-linux-appimage
          path: |
            budget/dist/*.AppImage
            budget/dist/*.tar.gz
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes || true
          gh release upload "$TAG" dist/*.AppImage dist/*.tar.gz --clobber
