name: Build Linux RPM Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-linux-rpm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: budget

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build and RPM dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsqlite3-dev \
            rpm

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build RPM package
        run: ./scripts/build_rpm.sh

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: cashon-linux-rpm
          path: budget/dist/*.rpm
          if-no-files-found: error
