name: Build Windows MSIX

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows-msix:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: budget
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release binary
        run: flutter build windows --release

      - name: Package Windows MSIX
        run: |
          dart pub global activate msix
          dart pub global run msix:create --build-windows false

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: cashon-windows-msix
          path: budget/build/windows/x64/runner/Release/*.msix
          if-no-files-found: error
