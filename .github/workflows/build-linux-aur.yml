name: Build Linux Arch / Pacman Repo

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v prefix (e.g. 1.0.1)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-linux-aur:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: budget

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          RAW="${{ github.event.inputs.version || github.ref_name }}"
          echo "version=${RAW#v}" >> "$GITHUB_OUTPUT"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsqlite3-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - name: Build Linux release bundle
        run: flutter build linux --release --build-name="${{ steps.ver.outputs.version }}" --build-number="${{ github.run_number }}"

      - name: Build Arch Linux package in Arch container
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          docker run --rm \
            -e VERSION="$VERSION" \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -v "$PWD:/work" \
            archlinux:base-devel \
            bash -lc '
              set -e
              useradd -m -u "$HOST_UID" builder || useradd -m builder
              chown -R builder /work/packaging/aur /work/dist || true
              mkdir -p /work/dist
              chown -R builder /work/dist
              su - builder -c "cd /work && VERSION=$VERSION ./scripts/build_aur.sh --skip-flutter"
              rm -f /work/dist/*-debug-*.pkg.tar.zst
            '

      - uses: actions/upload-artifact@v4
        with:
          name: cashon-linux-arch
          path: |
            budget/dist/*.pkg.tar.zst
            budget/packaging/aur/PKGBUILD
            budget/packaging/aur/.SRCINFO
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes || true
          gh release upload "$TAG" dist/*.pkg.tar.zst packaging/aur/PKGBUILD packaging/aur/.SRCINFO --clobber

  publish-pacman-repo:
    needs: [build-linux-aur]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cashon-linux-arch
          path: arch-dist

      - name: Checkout or initialize gh-pages branch
        run: |
          REPO_URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$REPO_URL" gh-pages >/dev/null 2>&1; then
            git clone --branch gh-pages --depth 1 "$REPO_URL" repo-pages
          else
            mkdir -p repo-pages
            git -C repo-pages init -b gh-pages
            git -C repo-pages remote add origin "$REPO_URL"
          fi

      - name: Update Pacman repository index (repo-add)
        run: |
          mkdir -p repo-pages/arch/x86_64
          cp arch-dist/*.pkg.tar.zst repo-pages/arch/x86_64/
          docker run --rm -v "$PWD/repo-pages/arch/x86_64:/repo" archlinux:base-devel bash -lc '
            set -e
            cd /repo
            repo-add -R cashon.db.tar.gz *.pkg.tar.zst
          '

      - name: Push gh-pages
        run: |
          cd repo-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(pacman): release ${{ github.ref_name }}" || exit 0
          git push -u origin gh-pages
