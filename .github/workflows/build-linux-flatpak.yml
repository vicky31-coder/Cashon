name: Build Linux Flatpak

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-linux-flatpak:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: budget

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build and Flatpak dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsqlite3-dev \
            flatpak

      - name: Install Freedesktop Platform runtime from Flathub
        run: |
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//24.08

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flatpak bundle
        run: ./scripts/build_flatpak.sh --no-install

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: cashon-linux-flatpak
          path: budget/dist/*.flatpak
          if-no-files-found: error
